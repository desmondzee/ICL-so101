[project]
name = "icl-so101"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "mujoco",
    "numpy",
    "pillow",
    "python-dotenv>=1.2.3",
    "reactor-sdk>=1.6.0",
    "so101-nexus[teleop]==0.7.0",
]

[project.optional-dependencies]
zero-wam = [
    "modal>=1.5,<2",
    "scipy>=1.16,<2",
    "pyarrow>=20,<26",
    "imageio[ffmpeg]>=2.37,<3",
]
schema = [
    "google-genai>=2.25.0",
    "jsonschema>=4.26.0",
    "pyarrow>=23.0.1",
    "scipy>=1.18.1",
    "transformers>=4.56",
]

[dependency-groups]
dev = []
