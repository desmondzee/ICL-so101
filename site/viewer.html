<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SO-101 Pair Viewer</title>
  <meta name="description" content="Browse the curated SO-101 human-robot pairs one at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
  <header class="bar">
    <div class="bar-inner">
      <a class="home" href="./">SO-101 HumanGen Pairs</a>
      <select id="task" aria-label="Category"></select>
      <div class="nav">
        <button id="prev" aria-label="Previous pair">‹ Prev</button>
        <span id="count" class="count"></span>
        <button id="next" aria-label="Next pair">Next ›</button>
      </div>
    </div>
  </header>
  <main class="stage">
    <h1 id="title" class="stage-title"></h1>
    <div class="videos big" id="videos"></div>
    <p id="caption" class="caption"></p>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
